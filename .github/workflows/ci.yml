name: CI

# Lightweight hygiene for the Remotion video project: keep the TypeScript valid.
# This is a render pipeline, not a deployed app — there is no CD by design.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Remotion typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
