name: sffs
version: 0.8.0
description: >-
  SFFS DRAFT-ONLY A/B quiz-video agent — safety core + read-only cycle data
  tools + the batch designer + the quality gates + never-repeat question
  selection + the render and S3-upload tools. Registers the Publer draft-only
  write tool, read-only do-not-touch snapshot/verify tools, read-only account/post
  listing + per-post analytics (scoring) tools, the A/B batch design tool
  (design-only), the hard quality-gate tool (dedup/validity/brand/render;
  fail-closed), the read-only never-repeat question selector, the video render tool
  (HermesQuiz mp4 + cloned-voice narration arms; DRAFT media only), the S3 media
  upload tool (private bucket + presigned GET URL), plus a pre_tool_call hook that
  hard-refuses any publish/schedule/post-mutation call across ALL tools. It can
  never publish or schedule a live post (belt AND suspenders AND framework-layer
  defense-in-depth DRAFT-ONLY).
author: "hermes-nous rebuild (ralph-wiggum overnight build)"
provides_tools:
  - sffs_publer_draft
  - sffs_donottouch_snapshot
  - sffs_donottouch_verify
  - sffs_publer_read
  - sffs_score
  - sffs_design
  - sffs_gates
  - sffs_questions
  - sffs_render
  - sffs_upload_s3
provides_hooks:
  - pre_tool_call
# NOTE: intentionally NO `requires_env` for Publer keys — the tools must still be
# discoverable (and refuse/dry-run safely) without keys. The real network call
# gates on PUBLER_API_KEY / PUBLER_WORKSPACE_ID at runtime in the Node bridge.
