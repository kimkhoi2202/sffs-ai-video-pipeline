name: sffs
version: 0.3.0
description: >-
  SFFS DRAFT-ONLY A/B quiz-video agent — safety core + read-only cycle data
  tools. Registers the Publer draft-only write tool, read-only do-not-touch
  snapshot/verify tools, read-only account/post listing + per-post analytics
  (scoring) tools, plus a pre_tool_call hook that hard-refuses any publish/
  schedule/post-mutation call across ALL tools. It can never publish or schedule
  a live post (belt AND suspenders AND framework-layer defense-in-depth DRAFT-ONLY).
author: "hermes-nous rebuild (ralph-wiggum overnight build)"
provides_tools:
  - sffs_publer_draft
  - sffs_donottouch_snapshot
  - sffs_donottouch_verify
  - sffs_publer_read
  - sffs_score
provides_hooks:
  - pre_tool_call
# NOTE: intentionally NO `requires_env` for Publer keys — the tools must still be
# discoverable (and refuse/dry-run safely) without keys. The real network call
# gates on PUBLER_API_KEY / PUBLER_WORKSPACE_ID at runtime in the Node bridge.
