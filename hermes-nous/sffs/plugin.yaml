name: sffs
version: 0.13.0
description: >-
  SFFS DRAFT-ONLY A/B quiz-video agent — safety core + read-only cycle data
  tools + the batch designer + the quality gates + never-repeat question
  selection + the render and S3-upload tools + the score-rollup (durable A/B
  memory) and the full end-to-end cycle orchestrator. Registers the
  draft-only write tool, read-only do-not-touch snapshot/verify tools, read-only
  account/post listing + per-post analytics (scoring) tools, the A/B batch design
  tool (design-only), the hard quality-gate tool (dedup/validity/brand/render;
  fail-closed), the read-only never-repeat question selector, the video render tool
  (HermesQuiz mp4 + cloned-voice narration arms; DRAFT media only), the S3 media
  upload tool (private bucket + presigned GET URL),   the score-rollup write tool
  (refresh ab-database.json + learnings.json — the cross-run A/B memory), the
  reconcile tool (back-fill native post ids/permalinks onto ab-database.json by
  matching metricool_uuid -> the published post, so scoring can learn from the
  agent's OWN posts; read-only on Metricool, idempotent), and the
  cycle orchestrator (one full DRAFT-ONLY cycle end to end; ties every tool
  together), plus a pre_tool_call hook that hard-refuses any publish/schedule/
  post-mutation call across ALL tools, plus a COST GOVERNOR + kill-switch
  (pre_tool_call/pre_llm_call/post_llm_call/subagent_start/subagent_stop hooks)
  that halts the factory + the loop + subagent fan-out on a kill-switch or a
  HIGH-but-finite daily $/token/spawn/concurrency ceiling (spend brake only —
  posting stays frozen at draft-only), plus the SOFTWARE FACTORY tool
  (sffs_factory) — the autonomous CODE self-improvement engine that proposes code
  changes (delegate_task fan-out) and auto-merges each ONLY on the two-key gate
  (harness GREEN AND review-agent APPROVE), cost-governed + kill-switched, scoped
  to the build branch (never main), dry-run by default. It can never publish or
  schedule a live post and can never push to main (belt AND suspenders AND
  framework-layer defense-in-depth DRAFT-ONLY).
author: "hermes-nous rebuild (ralph-wiggum overnight build)"
provides_tools:
  - sffs_donottouch_snapshot
  - sffs_donottouch_verify
  - sffs_score
  - sffs_design
  - sffs_gates
  - sffs_questions
  - sffs_render
  - sffs_upload_s3
  - sffs_score_rollup
  - sffs_reconcile
  - sffs_cycle
  - sffs_promote
  - sffs_factory
provides_hooks:
  - pre_tool_call     # publish_guard (DRAFT-ONLY belt) + cost_governor (spend brake)
  - pre_llm_call      # cost_governor advisory wind-down nudge
  - post_llm_call     # cost_governor estimated $/token accounting
  - subagent_start    # cost_governor concurrency + spawn tally
  - subagent_stop     # cost_governor concurrency release
# NOTE: intentionally NO `requires_env` for the scheduler keys — the tools must still be
# discoverable (and refuse/dry-run safely) without keys. The real network call
# gates on the METRICOOL_* credentials at runtime in the Node bridge.
